services:

  backend:
    build: ./backend
    container_name: zerodha-backend
    ports:
      - "3002:3002"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: zerodha-frontend
    ports:
      - "3000:80"
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: zerodha-dashboard
    ports:
      - "3001:80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: zerodha-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped