services:

  backend:
    build: ./backend
    container_name: zerodha-backend
    ports:
      - "3002:3002"
    env_file:
      - ./backend/.env
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  frontend:
    build: ./frontend
    container_name: zerodha-frontend
    ports:
      - "3000:80"
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  dashboard:
    build: ./dashboard
    container_name: zerodha-dashboard
    ports:
      - "3001:80"
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  nginx:
    image: nginx:alpine
    container_name: zerodha-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      dashboard:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s